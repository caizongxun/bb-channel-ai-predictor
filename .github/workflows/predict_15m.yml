name: Predict 15m Timeframe (LSTM)

on:
  schedule:
    - cron: '*/15 * * * *'  # 每15分鐘執行一次
  workflow_dispatch:  # 手動觸發

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -q torch pandas scikit-learn pyarrow requests huggingface-hub tqdm
      
      - name: Run predictions (15m) with LSTM
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TIMEFRAME: "15m"
          SYMBOLS: "BTCUSDT,ETHUSDT"
        run: |
          python colab_scripts/generate_predictions_lstm.py
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add predictions/ 2>/dev/null || true
          git commit -m "Auto-predict 15m LSTM - $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push
      
      - name: Upload to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Predictions uploaded to HuggingFace via TradingView request.seed()"